appId: app.beni.desktop
productName: Beni
copyright: Beni

afterPack: build/after-pack.js

directories:
  buildResources: build
  output: dist

files:
  - src/**
  - package.json

mac:
  category: public.app-category.productivity
  icon: build/icon.png
  target:
    - target: dmg
      arch: [universal]
  darkModeSupport: true
  # Sem conta de desenvolvedor não há notarização. A assinatura ad-hoc, que é
  # obrigatória em Apple Silicon, sai no build/after-pack.js — `identity: "-"`
  # aqui não funciona (o electron-builder procura esse nome no chaveiro).
  identity: null
  extendInfo:
    NSHumanReadableCopyright: Beni
    LSApplicationCategoryType: public.app-category.productivity

dmg:
  title: Beni
  artifactName: Beni-${version}-mac.dmg
  contents:
    - x: 140
      y: 190
      type: file
    - x: 400
      y: 190
      type: link
      path: /Applications
